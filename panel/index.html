<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Guard</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        padding: 14px;
        box-sizing: border-box;
        background: var(--oc-bg);
        color: var(--oc-fg);
        font-family: var(--oc-font);
        font-size: 13px;
        line-height: 1.5;
        overflow-y: auto;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        opacity: 0.65;
      }
      .pathrow {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0 10px;
        border-bottom: 1px solid var(--oc-border);
        margin-bottom: 8px;
      }
      .label {
        opacity: 0.65;
      }
      code,
      .model,
      .input {
        font-family: var(--oc-font-mono, ui-monospace, monospace);
        font-size: 12px;
      }
      .rows {
        display: flex;
        flex-direction: column;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px auto;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--oc-border);
      }
      .model {
        overflow-wrap: anywhere;
      }
      .empty {
        margin: 8px 0;
        opacity: 0.6;
      }
      .input {
        box-sizing: border-box;
        width: 100%;
        padding: 4px 6px;
        color: var(--oc-fg);
        background: var(--oc-bg-subtle, rgba(127, 127, 127, 0.1));
        border: 1px solid var(--oc-border);
        border-radius: 6px;
      }
      .input:focus {
        outline: 1px solid var(--oc-accent, #4c8dff);
      }
      .cap {
        text-align: right;
      }
      .addrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px auto;
        gap: 8px;
        margin-top: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btn {
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--oc-fg);
        background: var(--oc-bg-subtle, rgba(127, 127, 127, 0.12));
        border: 1px solid var(--oc-border);
        border-radius: 6px;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.1);
      }
      .btn.primary {
        color: var(--oc-accent-fg, #fff);
        background: var(--oc-accent, #4c8dff);
        border-color: transparent;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: var(--oc-danger, #e5534b);
      }
      .status {
        margin: 12px 0 0;
        min-height: 18px;
        font-size: 12px;
        opacity: 0.8;
      }
      .status[data-tone="ok"] {
        color: var(--oc-success, #3fb950);
      }
      .status[data-tone="warn"] {
        color: var(--oc-warning, #d29922);
      }
      .status[data-tone="err"] {
        color: var(--oc-danger, #e5534b);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
